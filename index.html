<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tea House</title>
    <!-- Google Font cdn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

    <!-- Font awesome cdn -->
    <script src="https://kit.fontawesome.com/baacb7e18e.js" crossorigin="anonymous"></script>

    <!-- Tailwind CSS cdn -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifford: '#da373d',
                    }
                }
            }
        }
    </script>
    <!-- font style -->
    <style>
        .manrope-font {
            font-family: "Manrope", sans-serif;
        }
        
        .plus-jakarta-sans-font {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
    </style>
</head>

<body class="manrope-font">
    <!-- Main Content -->
    <main class="max-w-screen-xl mx-auto md:px-15 xl:px-5 pt-21">
        <!-- Header Section -->
        <header class="flex ">
            <!-- Text content -->
            <div>
                <h1 class=" md:text-[2.5rem] lg:text-[4rem] xlg:text-[6rem] font-extrabold text-[#1C1C1C] ">It's good<br>tea time at The<br> Tea House</h1>
                <p class="text-[1.125rem] text-[#777777]">Tea and Botanical Solutions Supplier Give Optimum<br> Satisfaction To Your Taste Buds.</p>
                <button class="bg-gradient-to-r from-[#FF8938] to-[#FF0000] text-[#FFFFFF] font-bold text-[1.25rem] px-[19px] py-[18px] rounded-xl mt-[30px]">Explore More <i class="fa-solid fa-arrow-down -rotate-130"></i></button>
            </div>
            <!-- Banner Content -->
            <div class="relative md:pl-15 lg:pl-25">
                <!-- Banner Imagae -->
                <div class="md:pt-15 lg:pt-5">
                    <img class="w-full" src="images/banner.png" alt="Tea House Banner">
                </div>
                <!-- Card -->
                <div class="absolute flex gap-[13px] items-center bg-white shadow-lg py-[19px] px-[27px] md:top-85 md:left-15 lg:top-105 lg:left-50 rounded-lg">
                    <div>
                        <i class="fa-solid fa-star text-[#FFDC64] text-[48px]"></i>
                    </div>
                    <div>
                        <h2 class="font-extrabold text-[30px]">5.00</h2>
                        <p class="font-semibold text-[16px] text-[#777777]">Trust Pilot Ratings</p>
                    </div>
                </div>
            </div>
        </header>


    </main>
    <footer>

    </footer>
</body>

</html>
